name: CI/CD Build & Smoke Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Delisted CRM Dependencies
        run: |
          cd delisted-crm-database
          npm ci

      - name: Install HaaS ADU Configurator Dependencies
        run: |
          cd haas-adu-configurator
          npm ci

      - name: Generate Codebase Topology
        run: npm run topology:generate

      - name: Run Automated Smoke Tests
        run: npm run test:smoke

      - name: Build All Monorepo Applications (Scout 144 + Delisted CRM + HaaS ADU Configurator)
        run: npm run build:all
